name: Quality

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest
      # Establish a passing lint baseline for the newly reliability-critical
      # dispatcher and its tests; expand this scope as legacy findings are
      # remediated rather than shipping a permanently red CI check.
      - run: ruff check dispatcher.py tools/contracts.py tests
